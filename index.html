<body class="bg-cream text-slate-800 dark:bg-darker dark:text-slate-200 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, createContext, useContext, useRef, useCallback } = React;

        const initialData = {
            appSettings: {
                appTitle: "JELAS",
                appSubtitle: "JURNAL GURU FASE D",
                schoolName: "MTs Negeri 2 Kabupaten Gorontalo",
                logo: "",
                greetingPrefix: "Assalamu'alaikum",
                dashboardGreetingText: "AHLAN WA SAHLAN",
                welcomeText: "Selamat datang di Dashboard Jurnal Harian Guru Fase D. Semoga hari mengajar Anda menyenangkan!",
                quoteText: "Mendidik bukan hanya mengajar, tetapi membimbing setiap langkah menuju masa depan.",
                themeColor: "gold",
                loginTitle: "JURNAL HARIAN GURU",
                loginSubtitle: "Fase D – Kelas VII",
                loginSchoolName: "MTs Negeri 2 Kabupaten Gorontalo",
                loginInstruction: "Silakan masuk dengan Username / NIP Anda.",
                loginBtnText: "LOGIN SEKARANG",
                loginForgotText: "Lupa Password?",
                loginRememberText: "Ingat saya",
                loginFooterText: "© JELAS - Jurnal Elektronik Administrasi Sekolah"
            },
            kopSettings: {
                line1: "KEMENTERIAN AGAMA REPUBLIK INDONESIA",
                line2: "KANTOR KEMENTERIAN AGAMA KABUPATEN GORONTALO",
                line3: "MADRASAH TSANAWIYAH NEGERI 2 KABUPATEN GORONTALO",
                address: "Jl. Ahmad A. Wahab No. 123, Limboto, Kab. Gorontalo",
                contact: "Email: mtsn2gorontalo@kemenag.go.id | Telp: (0435) 881234",
                fontFamily: "helvetica",
                fontSizeLine1: 11,
                fontSizeLine2: 12,
                fontSizeLine3: 14,
                fontSizeAddress: 8.5,
                logoLeft: "",
                logoRight: "",
                showLogoLeft: true,
                showLogoRight: true,
                showLogo: true
            },
            teacher: {
                name: "Sandi Kurnianto Koniyo, S.Pd",
                nip: "19850101 201001 1 001",
                username: "19850101 201001 1 001",
                password: "password123",
                school: "MTs Negeri 2 Kabupaten Gorontalo",
                phase: "D",
                academicYear: "2026/2027",
                photo: "https://placehold.co/150x150/c59535/ffffff?text=SK",
                headmasterName: "Drs. H. Abd. Rahman, M.Pd",
                headmasterNip: "19710515 199703 1 002",
                lastPasswordChange: "Belum pernah diubah"
            },
            classes: [
                { id: 'c1', name: 'VII-A', studentCount: 32 },
                { id: 'c2', name: 'VII-B', studentCount: 30 },
                { id: 'c3', name: 'VII-C', studentCount: 31 },
                { id: 'c4', name: 'VII-D', studentCount: 32 },
                { id: 'c5', name: 'VII-E', studentCount: 29 },
                { id: 'c6', name: 'VII-F', studentCount: 30 },
                { id: 'c7', name: 'VII-G', studentCount: 31 },
            ],
            subjects: [
                "Bahasa Indonesia", 
                "Matematika", 
                "IPA", 
                "IPS", 
                "Bahasa Inggris", 
                "Pendidikan Agama Islam", 
                "Al-Qur'an Hadits",
                "Akidah Akhlak",
                "Fikih",
                "Sejarah Kebudayaan Islam (SKI)",
                "Bahasa Arab",
                "Informatika",
                "PJOK",
                "Pancasila / PPKn",
                "Seni Budaya",
                "Prakarya",
                "Muatan Lokal / Bahasa Gorontalo"
            ],
            materials: [
                { id: 'm1', subject: 'Bahasa Indonesia', chapter: 'Teks Deskripsi', title: 'Menelaah Struktur Teks Deskripsi' },
                { id: 'm2', subject: 'Bahasa Indonesia', chapter: 'Teks Narasi', title: 'Unsur Intrinsik Cerita Fantasi' },
            ],
            students: [],
            journals: [],
            attendance: []
        };

        const generateStudents = () => {
            let students = [];
            let idCounter = 1;
            initialData.classes.forEach(cls => {
                for(let i=0; i<5; i++) {
                    students.push({
                        id: `s${idCounter++}`,
                        nis: `2026${String(idCounter).padStart(3, '0')}`,
                        name: `Siswa Contoh ${idCounter} (${cls.name})`,
                        gender: i % 2 === 0 ? 'L' : 'P',
                        classId: cls.id,
                        className: cls.name
                    });
                }
            });
            return students;
        };
        initialData.students = generateStudents();

        const DB = {
            init: () => {
                if (!localStorage.getItem('jelas_data')) {
                    localStorage.setItem('jelas_data', JSON.stringify(initialData));
                }
            },
            get: () => {
                const data = JSON.parse(localStorage.getItem('jelas_data'));
                if (data && data.teacher) {
                    if (!data.teacher.username) data.teacher.username = data.teacher.nip || "19850101 201001 1 001";
                    if (!data.teacher.password) data.teacher.password = "password123";
                }
                return data;
            },
            set: (data) => localStorage.setItem('jelas_data', JSON.stringify(data)),
            saveJournal: (journal) => {
                const data = DB.get();
                if(journal.id) {
                    const idx = data.journals.findIndex(j => j.id === journal.id);
                    if(idx !== -1) data.journals[idx] = journal;
                } else {
                    journal.id = 'j_' + Date.now();
                    data.journals.unshift(journal);
                }
                DB.set(data);
                return journal;
            },
            deleteJournal: (id) => {
                const data = DB.get();
                data.journals = data.journals.filter(j => j.id !== id);
                DB.set(data);
            },
            saveAttendance: (date, classId, records) => {
                const data = DB.get();
                data.attendance = data.attendance.filter(a => !(a.date === date && a.classId === classId));
                data.attendance.push({ id: 'a_'+Date.now(), date, classId, records });
                DB.set(data);
            },
            saveAppSettings: (settings) => {
                const data = DB.get();
                data.appSettings = { ...data.appSettings, ...settings };
                DB.set(data);
            },
            saveKopSettings: (kop) => {
                const data = DB.get();
                data.kopSettings = kop;
                DB.set(data);
            },
            saveTeacher: (teacherData) => {
                const data = DB.get();
                data.teacher = { ...data.teacher, ...teacherData };
                DB.set(data);
            },
            saveSubjects: (subjects) => {
                const data = DB.get();
                data.subjects = subjects;
                DB.set(data);
            },
            saveClass: (cls) => {
                const data = DB.get();
                if(cls.id) {
                    const idx = data.classes.findIndex(c => c.id === cls.id);
                    if(idx !== -1) data.classes[idx] = cls;
                } else {
                    cls.id = 'c_' + Date.now();
                    data.classes.push(cls);
                }
                DB.set(data);
            },
            deleteClass: (id) => {
                const data = DB.get();
                data.classes = data.classes.filter(c => c.id !== id);
                DB.set(data);
            },
            saveStudent: (student) => {
                const data = DB.get();
                if(student.id) {
                    const idx = data.students.findIndex(s => s.id === student.id);
                    if(idx !== -1) data.students[idx] = student;
                } else {
                    student.id = 's_' + Date.now();
                    data.students.push(student);
                }
                DB.set(data);
            },
            deleteStudent: (id) => {
                const data = DB.get();
                data.students = data.students.filter(s => s.id !== id);
                DB.set(data);
            }
        };
        DB.init();

        const formatDate = (dateStr) => {
            if(!dateStr) return '';
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        };

        const getTodayStr = () => {
            const today = new Date();
            return today.toISOString().split('T')[0];
        };

        const AppContext = createContext();

        const AppProvider = ({ children }) => {
            const [data, setData] = useState(() => {
                const dbData = DB.get();
                if (!dbData.appSettings) dbData.appSettings = initialData.appSettings;
                if (!dbData.appSettings.dashboardGreetingText) dbData.appSettings.dashboardGreetingText = "AHLAN WA SAHLAN";
                if (!dbData.appSettings.loginTitle) dbData.appSettings.loginTitle = "JURNAL HARIAN GURU";
                if (!dbData.appSettings.loginSubtitle) dbData.appSettings.loginSubtitle = "Fase D – Kelas VII";
                if (!dbData.appSettings.loginSchoolName) dbData.appSettings.loginSchoolName = "MTs Negeri 2 Kabupaten Gorontalo";
                if (!dbData.appSettings.loginInstruction) dbData.appSettings.loginInstruction = "Silakan masuk dengan Username / NIP Anda.";
                if (!dbData.appSettings.loginBtnText) dbData.appSettings.loginBtnText = "LOGIN SEKARANG";
                if (!dbData.appSettings.loginForgotText) dbData.appSettings.loginForgotText = "Lupa Password?";
                if (!dbData.appSettings.loginRememberText) dbData.appSettings.loginRememberText = "Ingat saya";
                if (!dbData.appSettings.loginFooterText) dbData.appSettings.loginFooterText = "© JELAS - Jurnal Elektronik Administrasi Sekolah";
                DB.set(dbData);
                return dbData;
            });

            const [user, setUser] = useState(null);
            const [theme, setTheme] = useState(localStorage.getItem('theme') || 'light');
            const [currentView, setCurrentView] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);

            useEffect(() => {
                document.documentElement.className = theme;
                localStorage.setItem('theme', theme);
            }, [theme]);

            useEffect(() => {
                const activeColor = data.appSettings?.themeColor || 'gold';
                document.documentElement.setAttribute('data-theme-color', activeColor);
            }, [data.appSettings?.themeColor]);

            const refreshData = () => setData(DB.get());

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const askConfirm = ({ title, message, onConfirm }) => {
                setConfirmModal({ title, message, onConfirm });
            };

            const closeConfirm = () => setConfirmModal(null);

            const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');

            return (
                <AppContext.Provider value={{ 
                    data, refreshData, 
                    user, setUser, 
                    theme, toggleTheme,
                    currentView, setCurrentView,
                    showToast, askConfirm
                }}>
                    {children}
                    
                    {toast && (
                        <div className={`fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white font-medium z-50 animate-fade-in flex items-center gap-2 ${toast.type === 'success' ? 'bg-green-600' : 'bg-red-600'}`}>
                            <i className={`ph-fill ${toast.type === 'success' ? 'ph-check-circle' : 'ph-warning-circle'} text-xl`}></i>
                            {toast.message}
                        </div>
                    )}

                    {confirmModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkcard rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-800">
                                <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-4">
                                    <i className="ph ph-warning-diamond text-2xl"></i>
                                </div>
                                <h3 className="text-lg font-bold text-slate-800 dark:text-white mb-2">{confirmModal.title || 'Konfirmasi'}</h3>
                                <p className="text-sm text-slate-600 dark:text-slate-300 mb-6">{confirmModal.message}</p>
                                <div className="flex gap-3 justify-end">
                                    <button 
                                        type="button" 
                                        onClick={closeConfirm}
                                        className="px-4 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium text-sm"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => {
                                            confirmModal.onConfirm();
                                            closeConfirm();
                                        }}
                                        className="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white font-medium text-sm shadow-md"
                                    >
                                        Ya, Lanjutkan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </AppContext.Provider>
            );
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white dark:bg-darkcard rounded-xl shadow-sm border border-slate-100 dark:border-slate-800 p-6 ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, variant = 'primary', icon, onClick, className = "", type="button" }) => {
            const baseStyle = "inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 dark:focus:ring-offset-darker";
            const variants = {
                primary: "bg-gold-500 hover:bg-gold-600 text-white shadow-md shadow-gold-500/20 focus:ring-gold-500",
                secondary: "bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-200 focus:ring-slate-500",
                danger: "bg-red-50 hover:bg-red-100 text-red-600 dark:bg-red-900/20 dark:hover:bg-red-900/40 dark:text-red-400 focus:ring-red-500",
                ghost: "hover:bg-slate-100 text-slate-600 dark:hover:bg-slate-800 dark:text-slate-300"
            };
            return (
                <button type={type} onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {icon && <i className={`ph ${icon} text-lg`}></i>}
                    {children}
                </button>
            );
        };

        const Input = ({ label, type = "text", ...props }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">{label}</label>}
                <input 
                    type={type} 
                    className="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-slate-900 dark:text-white focus:ring-2 focus:ring-gold-500 focus:border-transparent transition-colors outline-none"
                    {...props}
                />
            </div>
        );

        const Select = ({ label, options, ...props }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">{label}</label>}
                <select 
                    className="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-slate-900 dark:text-white focus:ring-2 focus:ring-gold-500 focus:border-transparent transition-colors outline-none"
                    {...props}
                >
                    <option value="">-- Pilih --</option>
                    {options.map((opt, i) => (
                        <option key={i} value={opt.value || opt}>{opt.label || opt}</option>
                    ))}
                </select>
            </div>
        );

        const Badge = ({ status }) => {
            const styles = {
                'Terlaksana': 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400',
                'Sebagian Terlaksana': 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400',
                'Tidak Terlaksana': 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400',
            };
            const style = styles[status] || 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300';
            return <span className={`px-2.5 py-1 text-xs font-semibold rounded-full ${style}`}>{status}</span>;
        };

        const Sidebar = ({ isOpen, setIsOpen }) => {

        const ViewAccountSecurity = () => {
            const { data, showToast, refreshData } = useContext(AppContext);

            const [usernameForm, setUsernameForm] = useState({
                currentUsername: data.teacher?.username || data.teacher?.nip || "",
                newUsername: ""
            });

            const [passwordForm, setPasswordForm] = useState({
                currentPassword: "",
                newPassword: "",
                confirmPassword: ""
            });

            const [showCurrentPass, setShowCurrentPass] = useState(false);
            const [showNewPass, setShowNewPass] = useState(false);
            const [showConfirmPass, setShowConfirmPass] = useState(false);

            useEffect(() => {
                setUsernameForm(prev => ({
                    ...prev,
                    currentUsername: data.teacher?.username || data.teacher?.nip || ""
                }));
            }, [data.teacher]);

            const handleSaveUsername = (e) => {
                e.preventDefault();
                const trimmedNew = usernameForm.newUsername.trim();

                if (!trimmedNew) {
                    showToast("Username baru tidak boleh kosong!", "error");
                    return;
                }

                if (trimmedNew.length < 4) {
                    showToast("Username minimal 4 karakter!", "error");
                    return;
                }

                DB.saveTeacher({ username: trimmedNew });
                refreshData();
                setUsernameForm({ currentUsername: trimmedNew, newUsername: "" });
                showToast("Username login berhasil diperbarui!");
            };

            const handleSavePassword = (e) => {
                e.preventDefault();
                const realCurrentPass = data.teacher?.password || "password123";

                if (passwordForm.currentPassword !== realCurrentPass) {
                    showToast("Password lama yang Anda masukkan salah!", "error");
                    return;
                }

                if (passwordForm.newPassword.length < 6) {
                    showToast("Password baru minimal 6 karakter!", "error");
                    return;
                }

                if (passwordForm.newPassword !== passwordForm.confirmPassword) {
                    showToast("Konfirmasi password tidak cocok!", "error");
                    return;
                }

                const nowFormatted = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
                DB.saveTeacher({ 
                    password: passwordForm.newPassword,
                    lastPasswordChange: nowFormatted
                });
                refreshData();
                setPasswordForm({ currentPassword: "", newPassword: "", confirmPassword: "" });
                showToast("Password berhasil diperbarui! Silakan gunakan password baru pada login berikutnya.");
            };

            return (
                <div className="animate-fade-in max-w-4xl space-y-6">

                                            className="w-full px-4 py-2 pr-10 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-slate-900 dark:text-white focus:ring-2 focus:ring-gold-500 outline-none text-sm"
                                            required 
                                        />
                                        <button 
                                            type="button" 
                                            onClick={() => setShowCurrentPass(!showCurrentPass)}

                                            required

                                        <button

                                        >
                                            <i className={`ph ${showConfirmPass ? 'ph-eye-slash' : 'ph-eye'} text-lg`}></i>
                                        </button>
                                    </div>
                                </div>

                                <div className="pt-2 flex justify-end">
                                    <Button type="submit" icon="ph-lock-key">Perbarui Password</Button>
                                </div>

        const ViewSettings = () => {

                loginSubtitle: "Fase D – Kelas VII",
                loginSchoolName: "MTs Negeri 2 Kabupaten Gorontalo",
                loginInstruction: "Silakan masuk dengan Username / NIP Anda.",

            const [kopConfig, setKopConfig] = useState(data.kopSettings || {

                line3: "MADRASAH TSANAWIYAH NEGERI 2 KABUPATEN GORONTALO",
                address: "Jl. Ahmad A. Wahab No. 123, Limboto, Kab. Gorontalo",
                contact: "Email: mtsn2gorontalo@kemenag.go.id | Telp: (0435) 881234",
                fontFamily: "helvetica",
                fontSizeLine1: 11,
                fontSizeLine2: 12,
                fontSizeLine3: 14,
                fontSizeAddress: 8.5,
                logoLeft: "",
                logoRight: "",
                showLogoLeft: true,
                showLogoRight: true,
                showLogo: true
            });

            const [teacherConfig, setTeacherConfig] = useState(data.teacher || {
                name: '', nip: '', school: '', phase: 'D', academicYear: '2026/2027', photo: '', headmasterName: '', headmasterNip: ''

            const [newSubjectInput, setNewSubjectInput] = useState('');

            const colorOptions = [
                { id: 'gold', name: 'Gold Kemenag', colorClass: 'bg-[#c59535]' },
                { id: 'emerald', name: 'Emerald Islamic', colorClass: 'bg-[#10b981]' },
                { id: 'indigo', name: 'Royal Indigo', colorClass: 'bg-[#6366f1]' },
                { id: 'rose', name: 'Crimson Red', colorClass: 'bg-[#f43f5e]' },
                { id: 'teal', name: 'Ocean Teal', colorClass: 'bg-[#14b8a6]' },

            const handleKopChange = (e) => {
                const { name, value, type, checked } = e.target;
                setKopConfig({...kopConfig, [name]: type === 'checkbox' ? checked : value});
            };
            const handleTeacherChange = (e) => setTeacherConfig({...teacherConfig, [e.target.name]: e.target.value});

            const selectThemeColor = (colorId) => {
                const updated = { ...appConfig, themeColor: colorId };
                setAppConfig(updated);
                DB.saveAppSettings(updated);
                document.documentElement.setAttribute('data-theme-color', colorId);
                refreshData();
                showToast(`Tema warna diubah ke ${colorOptions.find(c => c.id === colorId)?.name || colorId}`);
            };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setAppConfig({...appConfig, logo: evt.target.result});
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleKopLogoUpload = (e, side) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setKopConfig(prev => ({...prev, [side]: evt.target.result}));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleTeacherPhotoUpload = (e) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setTeacherConfig({...teacherConfig, photo: evt.target.result});
                    };
                    reader.readAsDataURL(file);
                }
            };

            const saveConfig = (e) => {
                e.preventDefault();
                DB.saveAppSettings(appConfig);
                refreshData();
                showToast("Pengaturan aplikasi & tampilan berhasil disimpan");

            };

            const handleAddSubject = (e) => {
                e.preventDefault();
                const trimmed = newSubjectInput.trim();
                if (!trimmed) return;

                if (data.subjects.includes(trimmed)) {

                    return;

                const updated = [...data.subjects, trimmed];

            const handleDeleteSubject = (subjToDelete) => {

                        const updated = data.subjects.filter(s => s !== subjToDelete);
                        DB.saveSubjects(updated);
                        refreshData();
                        showToast('Mata pelajaran dihapus dari daftar');
                    }
                });
            };

            const exportPDF = () => {
                const doc = new jspdf.jsPDF();
                const kop = data.kopSettings || kopConfig;
                const pdfFont = kop.fontFamily || "helvetica";
                
                let startY = 10;
                const logoSize = 24;
                const leftMargin = 15;
                const rightMargin = 15;
                const pageWidth = 210;

                if (kop.showLogoLeft && (kop.logoLeft || data.appSettings?.logo)) {
                    try {
                        const logoLeftSrc = kop.logoLeft || data.appSettings.logo;
                        doc.addImage(logoLeftSrc, 'PNG', leftMargin, startY, logoSize, logoSize);
                    } catch (e) {
                        console.error("Gagal menambahkan logo kiri ke PDF", e);
                    }
                }

                if (kop.showLogoRight && kop.logoRight) {
                    try {
                        const rightX = pageWidth - rightMargin - logoSize;
                        doc.addImage(kop.logoRight, 'PNG', rightX, startY, logoSize, logoSize);
                    } catch (e) {
                        console.error("Gagal menambahkan logo kanan ke PDF", e);
                    }

                const fLine1 = Number(kop.fontSizeLine1) || 11;
                const fLine2 = Number(kop.fontSizeLine2) || 12;
                const fLine3 = Number(kop.fontSizeLine3) || 14;
                const fAddr = Number(kop.fontSizeAddress) || 8.5;

                doc.setFont(pdfFont, "bold");
                doc.setFontSize(fLine1);
                doc.text((kop.line1 || '').toUpperCase(), 105, startY + 4, { align: "center" });

                doc.setFontSize(fLine2);
                doc.text((kop.line2 || '').toUpperCase(), 105, startY + 10, { align: "center" });

                doc.setFontSize(fLine3);
                doc.text((kop.line3 || '').toUpperCase(), 105, startY + 17, { align: "center" });

                doc.setFont(pdfFont, "normal");
                doc.setFontSize(fAddr);
                doc.text(kop.address || '', 105, startY + 22, { align: "center" });
                doc.setFontSize(Math.max(6, fAddr - 0.5));
                doc.text(kop.contact || '', 105, startY + 26, { align: "center" });

                const lineY = startY + 29;
                doc.setLineWidth(1.5);
                doc.line(leftMargin, lineY, pageWidth - rightMargin, lineY);
                doc.setLineWidth(0.5);
                doc.line(leftMargin, lineY + 1.2, pageWidth - rightMargin, lineY + 1.2);

                doc.setFont(pdfFont, "bold");
                doc.setFontSize(12);
                doc.text((data.appSettings?.appTitle?.toUpperCase() || "JURNAL HARIAN GURU"), 105, lineY + 10, { align: "center" });
                doc.setFontSize(10);
                doc.setFont(pdfFont, "normal");
                doc.text(`Tahun Pelajaran ${data.teacher?.academicYear || '2026/2027'}`, 105, lineY + 15, { align: "center" });

                const tableColumn = ["No", "Tanggal", "Kelas", "Mata Pelajaran", "Materi Pokok", "Status"];
                const tableRows = data.journals.map((j, idx) => [
                    idx + 1,
                    formatDate(j.date),
                    j.class,
                    j.subject,
                    j.materi,
                    j.status
                ]);

                doc.autoTable({
                    head: [tableColumn],
                    body: tableRows,
                    startY: lineY + 20,
                    theme: 'grid',
                    styles: { fontSize: 8, font: pdfFont },
                    headStyles: { fillColor: [197, 149, 53] }
                });

                const finalY = doc.lastAutoTable.finalY || lineY + 40;
                doc.setFontSize(10);
                doc.setFont(pdfFont, "normal");
                doc.text("Mengetahui,", 14, finalY + 15);
                doc.text("Kepala Madrasah", 14, finalY + 20);
                
                doc.text("Gorontalo, " + formatDate(new Date().toISOString()), 140, finalY + 15);
                doc.text("Guru Mata Pelajaran", 140, finalY + 20);

                doc.setFont(pdfFont, "bold");
                doc.text(data.teacher.headmasterName || "...........................", 14, finalY + 40);
                doc.setFont(pdfFont, "normal");
                doc.text(`NIP. ${data.teacher.headmasterNip || '-'}`, 14, finalY + 45);

                doc.setFont(pdfFont, "bold");
                doc.text(data.teacher.name, 140, finalY + 40);
                doc.setFont(pdfFont, "normal");
                doc.text(`NIP. ${data.teacher.nip}`, 140, finalY + 45);

                doc.save("Jurnal_Harian_Guru.pdf");
                showToast("PDF Berhasil diexport");
            };

            const exportExcel = () => {
                const ws = XLSX.utils.json_to_sheet(data.journals);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Jurnal");
                XLSX.writeFile(wb, "Jurnal_Harian_Guru.xlsx");
                showToast("Excel Berhasil diexport");

            return (
                <div className="animate-fade-in max-w-3xl space-y-6">

                            Tema Warna Utama Aplikasi

                                const isSelected = appConfig.themeColor === item.id;

                                    <button

                                        type="button"

                                        className={`flex items-center gap-3 p-3 rounded-xl border-2 text-left transition-all ${
                                            isSelected

                                        <i className="ph ph-pencil-simple text-white"></i>

                                </div>

                                        </div>
                                        <div className="flex-1 text-xs">
                                            <label className="flex items-center gap-2 cursor-pointer font-medium text-slate-700 dark:text-slate-300 mb-1">
                                                <input 
                                                    type="checkbox" 
                                                    name="showLogoLeft" 
                                                    checked={kopConfig.showLogoLeft} 
                                                    onChange={handleKopChange} 
                                                    className="w-4 h-4 rounded text-gold-500 focus:ring-gold-500"
                                                />
                                                Tampilkan Logo Kiri
                                            </label>
                                            <p className="text-[11px] text-slate-500">Format JPG/PNG transparansi.</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <p className="text-xs font-bold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                                        <i className="ph ph-image text-gold-500"></i> Logo KOP Kanan (Misal: Logo Madrasah)
                                    </p>
                                    <div className="flex items-center gap-3">
                                        <div className="w-14 h-14 rounded-lg border-2 border-dashed border-slate-300 dark:border-slate-600 flex items-center justify-center overflow-hidden relative group bg-white dark:bg-darkcard">
                                            {kopConfig.logoRight ? (
                                                <img src={kopConfig.logoRight} alt="Logo Kanan" className="w-full h-full object-contain p-1" />
                                            ) : (
                                                <i className="ph ph-image text-slate-400 text-xl"></i>
                                            )}
                                            <input type="file" accept="image/*" onChange={(e) => handleKopLogoUpload(e, 'logoRight')} className="absolute inset-0 opacity-0 cursor-pointer" title="Unggah Logo Kanan" />
                                            <div className="absolute inset-0 bg-black/40 hidden group-hover:flex items-center justify-center pointer-events-none">
                                                <i className="ph ph-upload-simple text-white"></i>
                                            </div>
                                        </div>
                                        <div className="flex-1 text-xs">
                                            <label className="flex items-center gap-2 cursor-pointer font-medium text-slate-700 dark:text-slate-300 mb-1">
                                                <input 
                                                    type="checkbox" 
                                                    name="showLogoRight" 
                                                    checked={kopConfig.showLogoRight} 
                                                    onChange={handleKopChange} 
                                                    className="w-4 h-4 rounded text-gold-500 focus:ring-gold-500"
                                                />
                                                Tampilkan Logo Kanan
                                            </label>
                                            <p className="text-[11px] text-slate-500">Format JPG/PNG transparansi.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 space-y-4">
                                <p className="text-xs font-bold text-gold-600 dark:text-gold-400 uppercase tracking-wider flex items-center gap-2">
                                    <i className="ph ph-text-aa text-lg"></i> Pengaturan Font KOP Surat
                                </p>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <Select 
                                        label="Jenis Font (Font Family)" 
                                        name="fontFamily" 
                                        value={kopConfig.fontFamily || 'helvetica'} 
                                        onChange={handleKopChange}
                                        options={[
                                            { value: 'times', label: 'Times New Roman / Serif (Resmi Naskah Dinas)' },
                                            { value: 'helvetica', label: 'Helvetica / Arial (Sans-serif)' },
                                            { value: 'courier', label: 'Courier / Monospace' }
                                        ]}
                                    />
                                    <Input 
                                        label="Ukuran Baris 1 Instansi (pt)" 
                                        type="number" 
                                        step="0.5" 
                                        name="fontSizeLine1" 
                                        value={kopConfig.fontSizeLine1 || 11} 
                                        onChange={handleKopChange} 
                                    />
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <Input 
                                        label="Ukuran Baris 2 (pt)" 
                                        type="number" 
                                        step="0.5" 
                                        name="fontSizeLine2" 
                                        value={kopConfig.fontSizeLine2 || 12} 
                                        onChange={handleKopChange} 
                                    />
                                    <Input 
                                        label="Ukuran Baris 3 Utama (pt)" 
                                        type="number" 
                                        step="0.5" 
                                        name="fontSizeLine3" 
                                        value={kopConfig.fontSizeLine3 || 14} 
                                        onChange={handleKopChange} 
                                    />
                                    <Input 
                                        label="Ukuran Alamat & Kontak (pt)" 
                                        type="number" 
                                        step="0.5" 
                                        name="fontSizeAddress" 
                                        value={kopConfig.fontSizeAddress || 8.5} 
                                        onChange={handleKopChange} 
                                    />
                                </div>
                            </div>

                            <Input label="Instansi Baris 1" name="line1" value={kopConfig.line1} onChange={handleKopChange} placeholder="Contoh: KEMENTERIAN AGAMA REPUBLIK INDONESIA" required />
                            <Input label="Instansi Baris 2 (Kanwil/Kantah)" name="line2" value={kopConfig.line2} onChange={handleKopChange} placeholder="Contoh: KANTOR KEMENTERIAN AGAMA KABUPATEN GORONTALO" required />
                            <Input label="Nama Satker / Madrasah (Baris 3 Utama)" name="line3" value={kopConfig.line3} onChange={handleKopChange} placeholder="Contoh: MADRASAH TSANAWIYAH NEGERI 2 KABUPATEN GORONTALO" required />
                            <Input label="Alamat Lengkap" name="address" value={kopConfig.address} onChange={handleKopChange} placeholder="Jl. Ahmad A. Wahab No. 123, Limboto" required />
                            <Input label="Kontak / Email / Telepon / Website" name="contact" value={kopConfig.contact} onChange={handleKopChange} placeholder="Email: mtsn2@kemenag.go.id | Telp: (0435) 881234" required />

                            <div className="flex justify-end pt-2">
                                <Button type="submit" icon="ph-floppy-disk">Simpan Pengaturan KOP, Font, & Logo</Button>
                            </div>
                        </form>
                    </Card>

                    {/* Profile Guru & Headmaster */}
                    <Card>
                        <h3 className="font-bold text-lg mb-4 border-b border-slate-100 dark:border-slate-800 pb-2">Profil Guru & Kepala Madrasah</h3>
                        <form onSubmit={saveTeacherProfile} className="space-y-4">
                            <div className="flex items-center gap-4 mb-4">
                                <div className="w-16 h-16 rounded-full border-2 border-gold-400 flex items-center justify-center overflow-hidden relative group">
                                    <img src={teacherConfig.photo || "https://placehold.co/150x150/c59535/ffffff?text=Guru"} alt="Foto Guru" className="w-full h-full object-cover" />
                                    <input type="file" accept="image/*" onChange={handleTeacherPhotoUpload} className="absolute inset-0 opacity-0 cursor-pointer" title="Ubah Foto Profil" />
                                    <div className="absolute inset-0 bg-black/50 hidden group-hover:flex items-center justify-center pointer-events-none transition-all">
                                        <i className="ph ph-camera text-white"></i>
                                    </div>
                                </div>
                                <div>
                                    <p className="text-sm font-medium">Foto Profil Guru</p>
                                    <p className="text-xs text-slate-500">Klik foto untuk mengganti foto profil Anda</p>
                                </div>
                            </div>

                            <div className="grid md:grid-cols-2 gap-4">
                                <Input label="Nama Lengkap Guru (dengan Gelar)" name="name" value={teacherConfig.name} onChange={handleTeacherChange} required />
                                <Input label="NIP Guru" name="nip" value={teacherConfig.nip} onChange={handleTeacherChange} required />
                            </div>

                            <div className="grid md:grid-cols-3 gap-4">
                                <Input label="Fase Mengajar" name="phase" value={teacherConfig.phase} onChange={handleTeacherChange} required />
                                <Input label="Tahun Pelajaran" name="academicYear" value={teacherConfig.academicYear} onChange={handleTeacherChange} required />
                                <Input label="Nama Sekolah/Madrasah" name="school" value={teacherConfig.school} onChange={handleTeacherChange} required />
                            </div>

                            <div className="grid md:grid-cols-2 gap-4 border-t border-slate-100 dark:border-slate-800 pt-4">
                                <Input label="Nama Kepala Madrasah" name="headmasterName" value={teacherConfig.headmasterName} onChange={handleTeacherChange} required />
                                <Input label="NIP Kepala Madrasah" name="headmasterNip" value={teacherConfig.headmasterNip} onChange={handleTeacherChange} required />
                            </div>

                            <div className="flex justify-end pt-2">
                                <Button type="submit" icon="ph-floppy-disk">Simpan Profil Guru</Button>
                            </div>
                        </form>
                    </Card>
                </div>
            );
        };

        const ViewGenericCrud = ({ title, items, fields, onSave, onDelete }) => {
            const { showToast, askConfirm } = useContext(AppContext);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editItem, setEditItem] = useState(null);
            const [formData, setFormData] = useState({});

            const handleOpenModal = (item = null) => {
                setEditItem(item);
                if (item) {
                    setFormData(item);
                } else {
                    const empty = {};
                    fields.forEach(f => empty[f.name] = '');
                    setFormData(empty);
                }
                setIsModalOpen(true);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave(formData);
                setIsModalOpen(false);
                showToast(`Data ${title} berhasil disimpan`);
            };

            const handleDelete = (id) => {
                askConfirm({
                    title: `Hapus ${title}`,
                    message: `Apakah Anda yakin ingin menghapus data ini?`,
                    onConfirm: () => {
                        onDelete(id);
                        showToast(`Data ${title} berhasil dihapus`);
                    }
                });
            };

            return (
                <div className="animate-fade-in space-y-4">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold">{title}</h2>
                            <p className="text-slate-500 text-sm">Kelola daftar {title.toLowerCase()} Anda.</p>
                        </div>
                        <Button icon="ph-plus" onClick={() => handleOpenModal()}>Tambah {title}</Button>
                    </div>

                    <Card className="!p-0 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50 dark:bg-slate-800/80 text-slate-500 border-b border-slate-200 dark:border-slate-700">
                                    <tr>
                                        <th className="px-6 py-4 font-medium w-12 text-center">No</th>
                                        {fields.map(f => (
                                            <th key={f.name} className="px-6 py-4 font-medium">{f.label}</th>
                                        ))}
                                        <th className="px-6 py-4 font-medium text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {items.length === 0 ? (
                                        <tr><td colSpan={fields.length + 2} className="px-6 py-8 text-center text-slate-500">Belum ada data {title.toLowerCase()}.</td></tr>
                                    ) : (
                                        items.map((item, idx) => (
                                            <tr key={item.id || idx} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                                                <td className="px-6 py-4 text-center">{idx + 1}</td>
                                                {fields.map(f => (
                                                    <td key={f.name} className="px-6 py-4">{item[f.name]}</td>
                                                ))}
                                                <td className="px-6 py-4 text-right space-x-2">
                                                    <button onClick={() => handleOpenModal(item)} className="p-1.5 text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded"><i className="ph ph-pencil-simple text-lg"></i></button>
                                                    <button onClick={() => handleDelete(item.id)} className="p-1.5 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30 rounded"><i className="ph ph-trash text-lg"></i></button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkcard rounded-xl p-6 max-w-md w-full shadow-2xl border border-slate-200 dark:border-slate-800">
                                <h3 className="font-bold text-lg mb-4">{editItem ? 'Edit' : 'Tambah'} {title}</h3>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    {fields.map(f => (
                                        f.type === 'select' ? (
                                            <Select 
                                                key={f.name}
                                                label={f.label}
                                                options={f.options}
                                                value={formData[f.name] || ''}
                                                onChange={e => setFormData({...formData, [f.name]: e.target.value})}
                                                required
                                            />
                                        ) : (
                                            <Input 
                                                key={f.name} 
                                                label={f.label} 
                                                type={f.type || 'text'}
                                                value={formData[f.name] || ''} 
                                                onChange={e => setFormData({...formData, [f.name]: e.target.value})} 
                                                required 
                                            />
                                        )
                                    ))}
                                    <div className="flex justify-end gap-2 pt-4 border-t border-slate-100 dark:border-slate-800">
                                        <Button variant="ghost" onClick={() => setIsModalOpen(false)}>Batal</Button>
                                        <Button type="submit">Simpan</Button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MainContent = () => {
            const { currentView, data, refreshData } = useContext(AppContext);

            switch(currentView) {
                case 'dashboard': return <ViewDashboard />;
                case 'jurnal_list': return <ViewJurnalList />;
                case 'jurnal_form': return <ViewJurnalForm />;
                case 'presensi': return <ViewPresensi />;
                case 'kelas': 
                    return <ViewGenericCrud 
                        title="Kelas" 
                        items={data.classes} 
                        fields={[
                            { name: 'name', label: 'Nama Kelas' },
                            { name: 'studentCount', label: 'Jumlah Siswa', type: 'number' }
                        ]}
                        onSave={(item) => { DB.saveClass(item); refreshData(); }}
                        onDelete={(id) => { DB.deleteClass(id); refreshData(); }}
                    />;
                case 'siswa':
                    return <ViewGenericCrud 
                        title="Siswa" 
                        items={data.students} 
                        fields={[
                            { name: 'nis', label: 'NIS / NISN' },
                            { name: 'name', label: 'Nama Siswa' },
                            { name: 'gender', label: 'Jenis Kelamin (L/P)', type: 'select', options: [{value: 'L', label: 'Laki-laki'}, {value: 'P', label: 'Perempuan'}] },
                            { name: 'className', label: 'Kelas', type: 'select', options: data.classes.map(c => ({value: c.name, label: c.name})) }
                        ]}
                        onSave={(item) => { 
                            const cls = data.classes.find(c => c.name === item.className);
                            if(cls) item.classId = cls.id;
                            DB.saveStudent(item); 
                            refreshData(); 
                        }}
                        onDelete={(id) => { DB.deleteStudent(id); refreshData(); }}
                    />;
                case 'account_security': return <ViewAccountSecurity />;
                case 'settings': return <ViewSettings />;
                default: return <ViewDashboard />;
            }
        };

        const App = () => {
            const { user } = useContext(AppContext);
            const [sidebarOpen, setSidebarOpen] = useState(false);

            if (!user) {
                return <ViewLogin />;
            }

            return (
                <div className="min-h-screen bg-cream dark:bg-darker text-slate-800 dark:text-slate-200 font-sans flex">
                    <Sidebar isOpen={sidebarOpen} setIsOpen={setSidebarOpen} />
                    
                    <div className="flex-1 flex flex-col min-w-0 lg:pl-64">
                        <Header toggleSidebar={() => setSidebarOpen(!sidebarOpen)} />
                        
                        <main className="flex-1 p-4 md:p-8 max-w-7xl w-full mx-auto">
                            <MainContent />
                        </main>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(
            <AppProvider>
                <App />
            </AppProvider>
        );
    </script>
</body>
</html>
